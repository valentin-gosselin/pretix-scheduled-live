name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip flake8
      - name: Lint with flake8
        run: |
          flake8 pretix_scheduled_live --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 pretix_scheduled_live --count --statistics

  test:
    # The tests need a real pretix, since they exercise its URL routing,
    # permission middleware, periodic task runner and settings store. Running
    # them inside the official image is the cheapest way to get one: pretix
    # falls back to SQLite when no database is configured, so no service
    # container is needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pretix: ['stable', '2026.5']
    container:
      image: pretix/standalone:${{ matrix.pretix }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Show the pretix version under test
        run: python3 -c "import pretix; print(pretix.__version__)"

      - name: Install test dependencies
        run: pip3 install --no-cache-dir pytest pytest-django

      - name: Install the plugin
        run: pip3 install --no-cache-dir --no-deps -e .

      - name: Run the test suite
        run: python3 -m pytest -q -p no:cacheprovider pretix_scheduled_live/tests/

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
