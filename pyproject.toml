[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-scheduled-live"
version = "1.0.0"
description = "Schedule the date and time at which a pretix ticket shop goes live"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Valentin Gosselin", email = "valentin@gosselin.pro"}
]
keywords = ["pretix", "plugin", "schedule", "publication", "live"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: Django",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Spanish",
    "Natural Language :: Italian",
    "Natural Language :: Dutch",
    "Natural Language :: Portuguese",
    "Natural Language :: Polish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/valentin-gosselin/pretix-scheduled-live"
Repository = "https://github.com/valentin-gosselin/pretix-scheduled-live"
Issues = "https://github.com/valentin-gosselin/pretix-scheduled-live/issues"
Changelog = "https://github.com/valentin-gosselin/pretix-scheduled-live/blob/main/CHANGELOG.md"

[project.entry-points."pretix.plugin"]
pretix_scheduled_live = "pretix_scheduled_live:ScheduledLivePluginConfig"

[tool.setuptools.packages.find]
where = ["."]
include = ["pretix_scheduled_live*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pretix_scheduled_live = [
    "templates/**/*.html",
    "templates/**/*.txt",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pretix.testutils.settings"
python_files = ["test_*.py"]
testpaths = ["pretix_scheduled_live/tests"]

[tool.isort]
profile = "black"
line_length = 100
known_django = ["django", "rest_framework", "pretix"]
known_first_party = ["pretix_scheduled_live"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
